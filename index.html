<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Baseline -->
    <title>Perceptix Digital | Full-Stack Web Development, Growth & AI Systems</title>
    <meta name="description" content="Perceptix Digital is an integrated digital agency providing custom web development, search engine optimization, paid advertising, and automated lead management systems under one accountable team." />

    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Perceptix Digital" />
    <meta property="og:title" content="Perceptix Digital | Full-Stack Web Development, Growth & AI Systems" />
    <meta property="og:description" content="Perceptix Digital is an integrated digital agency providing custom web development, SEO, paid ads, and automated lead intake under one accountable team." />
    <meta property="og:image" content="/perceptix_logo.png" />

    <!-- Twitter Card Meta -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Perceptix Digital | Full-Stack Web Development, Growth & AI Systems" />
    <meta name="twitter:description" content="Integrated web development, search engine optimization, paid advertising, and automated lead intake systems." />
    <meta name="twitter:image" content="/perceptix_logo.png" />

    <!-- Structured Data JSON-LD Schema for Search Engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Perceptix Digital",
        "url": "https://perceptixdigital.com",
        "logo": "https://perceptixdigital.com/perceptix_logo.png",
        "description": "Full-stack digital agency specializing in custom web development, Shopify e-commerce, SEO, paid ads, and AI lead automation systems.",
        "email": "hello@perceptixdigital.com",
        "priceRange": "$$",
        "areaServed": ["US", "CA", "Global"],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Digital Engineering & Growth Packages",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "The Authority Website Package",
                "description": "5-7 page custom WordPress site, mobile responsiveness, on-page SEO, and speed optimization at launch."
              },
              "price": "500",
              "priceCurrency": "USD"
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "The Local Lead Engine",
                "description": "SEO-optimized conversion landing page connected to an automated lead intake and routing system."
              },
              "price": "500",
              "priceCurrency": "USD"
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "The Speed Fix",
                "description": "Full technical website speed optimization pass for existing WordPress and Shopify sites."
              },
              "price": "150",
              "priceCurrency": "USD"
            }
          ]
        }
      }
    </script>

    <!-- Google Fonts: Outfit (Headings) & Inter (Body Copy) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-white text-gray-900 font-sans antialiased">
    <div id="root"></div>
